version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    depends_on:
      - kafka
    ports:
      - "8083:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092

  flink-jobmanager:
    image: flink:1.18.0-scala_2.12
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager

  flink-taskmanager:
    image: flink:1.18.0-scala_2.12
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pw
      POSTGRES_DB: db
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ../monitoring/grafana_datasources.yml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ../monitoring/grafana_dashboards_provider.yml:/etc/grafana/provisioning/dashboards/provider.yaml
      - ../monitoring/grafana_dashboard.json:/etc/grafana/provisioning/dashboards/dashboard.json

  iot-producer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.producer
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  clickstream-producer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.producer
    depends_on:
      - kafka
    entrypoint: ["python", "producers/clickstream_producer.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  mpesa-producer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.producer
    depends_on:
      - kafka
    entrypoint: ["python", "producers/mpesa_producer.py"]
    ports:
      - "8003:8003"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PROMETHEUS_METRICS_PORT: "8003"

  dlq-consumer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.producer
    depends_on:
      - kafka
    entrypoint: ["python", "consumers/dlq_consumer.py"]
    ports:
      - "8002:8002"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  alert-consumer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.producer
    depends_on:
      - kafka
    entrypoint: ["python", "consumers/alert_consumer.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  flink-job-submitter:
    build:
      context: ..
      dockerfile: docker/Dockerfile.processor
    depends_on:
      - flink-jobmanager
    entrypoint: ["/bin/bash", "/app/scripts/submit_jobs.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
