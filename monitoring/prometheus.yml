global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'flink'
    static_configs:
      - targets: ['flink-jobmanager:8081']

  - job_name: 'dlq-consumer'
    static_configs:
      - targets: ['dlq-consumer:8002']

  - job_name: 'mpesa-producer'
    static_configs:
      - targets: ['mpesa-producer:8003']
